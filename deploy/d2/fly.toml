# Candidate D2 sample deployment. Reserve this app name after login, or change app and PUBLIC_ORIGIN together.
app = "sas-d2-sample-berkin"
primary_region = "fra"

[build]
  dockerfile = "deploy/d2/sample.Dockerfile"

[env]
  PORT = "8787"
  STELLAR_NETWORK = "stellar:testnet"
  PUBLIC_ORIGIN = "https://sas-d2-sample-berkin.fly.dev"
  JOB_DB_PATH = "/data/jobs.sqlite"
  PAY_TO = "GDZTNESUUP2YODFWW5TIOVV2PN43JTJFIEZ7ML4JC2VCHOXWNSTV44SC"
  # The owner supplies AGENT_ID after wallet-approved registration; no Stellar secret belongs here.

[[mounts]]
  source = "jobs"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
