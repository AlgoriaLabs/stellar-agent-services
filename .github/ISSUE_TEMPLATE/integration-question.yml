name: Integration question
description: Help building a provider, putting an API behind the gateway, or building a client that pays providers.
labels: [integration]
body:
  - type: dropdown
    id: path
    attributes:
      label: Path
      description: The path from AGENTS.md §2.
      options:
        - New TypeScript service (Kit library)
        - Existing API (gateway)
        - Native implementation (another language)
        - Client, wallet or adapter
        - Verification or 8004 registration
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: What are you building?
      description: The service or client, its stack, and the network (testnet or pubnet).
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened
      description: Commands, `verifier check` or `provider-kit check` output, and the rule ids it names. Remove keys and job tokens.
      render: text
    validations:
      required: true
  - type: input
    id: manifest
    attributes:
      label: Manifest URL
      description: Optional. Only if it is public.
