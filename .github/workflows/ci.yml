name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run llms:check
      - run: npm run check --workspace @stellar-agent-services/wallet
      - run: npm run build --workspace @stellar-agent-services/wallet
      - run: npm run check --workspace @stellar-agent-services/provider-kit
      - run: npm run build:approve --workspace @stellar-agent-services/provider-kit
