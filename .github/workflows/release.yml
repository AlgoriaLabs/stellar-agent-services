name: release

# A release, from a version tag such as v0.1.0: every CI check again on that commit, then the npm packages, the gateway
# image on GitHub Container Registry and a GitHub release. `npm run packages:version <x.y.z>` sets the version first;
# CONTRIBUTING.md has the steps. Run by hand (Actions → release → Run workflow), it goes through the same steps and,
# with "dry run" left on, publishes nothing.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Go through the release without publishing anything
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  npm:
    name: npm packages
    needs: ci
    runs-on: ubuntu-latest
    # Add protection rules to this environment (Settings → Environments) to approve each publish by hand.
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing, and provenance that links each version to this workflow run
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          # No dependency cache in a release build: what gets published comes from the lockfile alone.
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: node scripts/packages.mjs publish ${{ env.DRY_RUN == 'true' && '--dry-run' || '' }}
        env:
          # Only until npm trusts this workflow (trusted publishing): see CONTRIBUTING.md. Empty afterwards.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  image:
    name: Gateway image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/provider-kit" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: |
            org.opencontainers.image.title=provider-kit
            org.opencontainers.image.description=The Provider Kit gateway: an existing HTTP API behind x402 USDC payments on Stellar (Provider Standard v1)
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.DRY_RUN != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/provider-kit/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.DRY_RUN != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

  github-release:
    name: GitHub release
    needs: [npm, image]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Release notes from the merged pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes $([[ "$TAG" == *-* ]] && echo --prerelease)
